<main class="intro-page">
  <section class="intro-screen" aria-label="Intro">
    <div class="intro-content">
      <div class="intro-text">
        <img class="logo" src="assets/intro/logo.svg" alt="Climapp" />
        <div class="intro-copy">
          <p class="intro-kicker">
            <!-- Seu clima em destaque -->
            <ng-content select="[kicker]"></ng-content>
          </p>
          <h1>
            <!-- Boas-vindas! -->
            <ng-content select="[title]"></ng-content>
          </h1>
          <p class="intro-description">
            <!-- Previsões claras, alertas inteligentes e um visual pensado para você acompanhar a semana
            inteira em um só lugar. -->
            <ng-content select="[description]"></ng-content>

            <ng-content select="[optional-content]"></ng-content>
          </p>
        </div>
        <button class="intro-button" type="button" routerLink="/home">
          <span>
            <!-- Entrar -->
            <ng-content select="[button]"></ng-content>
          </span>
          <svg class="intro-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z" />
          </svg>
        </button>
      </div>
      <div class="intro-visual">
        <img class="illustration" src="assets/intro/illustration.png" alt="Ilustracao do clima" />
        <div class="intro-tag">
          <span class="tag-title">Previsão clara</span>
          <span class="tag-subtitle">Organize sua semana</span>
        </div>
      </div>
    </div>
  </section>
</main>
